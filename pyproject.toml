[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "animus"
version = "0.1.0"
description = "A lightweight, game-agnostic personality engine for autonomous NPC decision-making"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "watchdog>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/animus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
