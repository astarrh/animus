[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "animus"
version = "0.2.0"
description = "A lightweight, game-agnostic personality engine for autonomous NPC decision-making"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "watchdog>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/animus"]

# Ensure the default coefficient JSON ships in the wheel even if file selection
# ever excludes non-.py assets.
[tool.hatch.build.targets.wheel.force-include]
"src/animus/data/personality_building_blocks.json" = "animus/data/personality_building_blocks.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
